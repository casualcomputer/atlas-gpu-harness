[project]
name = "atlas-gpu-harness"
version = "0.3.0"
description = "Pick a model; atlas tries vLLM, SGLang and llama.cpp on your GPU and keeps the fastest verified serving config."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.30",
    # 1.82.7 and 1.82.8 were compromised in a March 2026 supply-chain attack.
    "litellm>=1.70,!=1.82.7,!=1.82.8",
    "psutil>=5.9,<8",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Mirror local memory to MongoDB Atlas.
atlas = ["pymongo>=4.10,<5"]
# Hackathon-era `atlas-harness` tools (native llama.cpp MoE loop, Strata, top-k).
harness = ["pymongo>=4.10,<5", "filelock>=3.13,<4", "gguf==0.19.0"]
torch = ["torch>=2.8"]
video = ["pillow>=10"]

[project.scripts]
atlas = "atlas_tune.cli:main"
# Hackathon-era experiments (top-k, native llama.cpp MoE codegen, Strata).
atlas-harness = "atlas_gpu_harness.cli:main"

[dependency-groups]
dev = ["mongomock>=4.3,<5", "pymongo>=4.10,<5", "filelock>=3.13,<4", "gguf==0.19.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_tune", "atlas_gpu_harness"]

[tool.uv]
default-groups = ["dev"]
