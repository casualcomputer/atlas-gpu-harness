[project]
name = "atlas-tune"
version = "0.5.0"
description = "Pick a model; atlas tries vLLM, SGLang and llama.cpp on your GPU and keeps the fastest verified serving config."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.30",
    # 1.82.7 and 1.82.8 were compromised in a March 2026 supply-chain attack.
    "litellm>=1.70,!=1.82.7,!=1.82.8",
    "psutil>=5.9,<8",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Mirror local memory to MongoDB Atlas.
atlas = ["pymongo>=4.10,<5"]

[project.scripts]
atlas = "atlas_tune.cli:main"

[dependency-groups]
dev = ["pymongo>=4.10,<5", "pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_tune"]

[tool.uv]
default-groups = ["dev"]
